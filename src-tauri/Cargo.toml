[package]
name = "lovedscreen"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "lovedscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
airplay-core = { path = "crates/airplay-core" }
airplay-render = { path = "crates/airplay-render" }

[workspace]
members = [".", "crates/airplay-core", "crates/airplay-render"]
