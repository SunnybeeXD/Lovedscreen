name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            make
            diffutils
      - run: rustc -vV
      - run: which node cargo
      - run: |
          FFMPEG_VERSION="$(pacman -Si mingw-w64-ucrt-x86_64-ffmpeg | awk '/^Version/{print $3}' | sed 's/^[0-9]*://; s/-[0-9]*$//')"
          echo "building FFmpeg $FFMPEG_VERSION and gst-libav for GStreamer $(pkg-config --modversion gstreamer-1.0)"
          export FFMPEG_VERSION
          scripts/build-minimal-libav.sh
      - run: scripts/stage-runtime.sh
      - name: Startup smoke test
        run: cd src-tauri && cargo test -p airplay-render --test new_default
      - run: npm ci
      - run: npx tauri build
      - run: |
          ldd src-tauri/target/release/lovedscreen.exe
          ! ldd src-tauri/target/release/lovedscreen.exe | grep -iE 'libplist|libcrypto|libssl'
      - run: ls -l src-tauri/target/release/lovedscreen.exe src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
