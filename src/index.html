<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovedscreen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Lovedscreen</h1>
    <span id="pill" class="pill"><i></i><b id="state">Stopped</b></span>
  </header>
  <label class="field">
    <span>Device name</span>
    <input id="name" value="Lovedscreen" spellcheck="false">
  </label>
  <button id="toggle" class="primary">Start receiver</button>
  <ol class="steps">
    <li>Same Wi-Fi as your iPhone, set to Private in Windows</li>
    <li>Control Center, Screen Mirroring, pick the name above</li>
    <li>Press F11 in the mirror window for fullscreen</li>
  </ol>
  <pre id="log" aria-label="Receiver log"></pre>
</main>
<script src="main.js"></script>
</body>
</html>
