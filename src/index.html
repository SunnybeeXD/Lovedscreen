<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovedscreen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Lovedscreen</h1>
  <label>Device name <input id="name" value="Lovedscreen"></label>
  <button id="toggle">Start receiver</button>
  <p id="state">Stopped</p>
  <p class="hint">On your iPhone: Control Center, Screen Mirroring, pick this name. Both devices must be on the same Wi-Fi, and Windows must see that network as Private. F11 toggles fullscreen.</p>
  <pre id="log"></pre>
</main>
<script src="main.js"></script>
</body>
</html>
